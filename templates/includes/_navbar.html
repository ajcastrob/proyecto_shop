<div class="navbar bg-base-100 border-b border-base-200 px-0">
  <div class="container mx-auto flex px-4 sm:px-6 lg:px-8">

    <!-- Brand -->
    <div class="navbar-start">
      <a class="btn btn-ghost gap-2 px-2 font-serif text-xl font-bold" href="{% url 'home:home' %}">
        <span class="size-2 rounded-full bg-primary"></span>
        Shop
      </a>
    </div>

    <!-- Carrito -->
    <div class="navbar-center">
      <a href="{% url 'orders:cart_detail' %}"
         class="btn btn-ghost btn-circle indicator">
        <span class="indicator-item badge badge-primary badge-sm tabular-nums">
            {{ cart_count }}
        </span>
        <svg class="size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4M1 2v2h2l3.6 7.59-1.35 2.44A2 2 0 0 0 7.09 16H17a2 2 0 0 0 1.84-1.22l3.02-5.29A1 1 0 0 0 21 8.62V6H5.21l-.94-2H1m16 16v-2a2 2 0 0 0-2-2H7.42a2 2 0 0 0-1.22 1.03L6 18h11"/>
        </svg>
      </a>
    </div>

    <!-- End actions -->
    <div class="navbar-end flex gap-2">

            <!-- Theme toggle -->
      <label class="swap swap-rotate">
        <input
          id="toggle-switch"
          type="checkbox"
          class="theme-controller"
          value="dark"
        />
        <!-- sun -->
        <svg class="swap-off h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Z"/>
        </svg>
        <!-- moon -->
        <svg class="swap-on h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-.57,1,1,0,0,0-1.61-1.23A10.17,10.17,0,1,0,22.27,13.6,1,1,0,0,0,21.64,13Z"/>
        </svg>
      </label>

    </div>
  </div>
</div>

{% block scripts %}
<script>
  // El tema ya fue inicializado en <head> (base.html).
  // Aquí solo se sincroniza el toggle y se escucha el cambio.
  const themeToggle = document.querySelector("#toggle-switch");
  if (themeToggle) {
    themeToggle.checked = document.documentElement.getAttribute("data-theme") === "dark";

    themeToggle.addEventListener("change", () => {
      const newTheme = themeToggle.checked ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("theme", newTheme);
    });
  }
</script>
{% endblock %}
